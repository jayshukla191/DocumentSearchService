# AWS Environment Configuration
# This profile is activated when deploying to AWS ECS

spring:
  application:
    name: document-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/document_management}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          time_zone: UTC
    open-in-view: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: ${SERVER_PORT:8080}

# AWS Configuration - Values come from ECS task environment variables
aws:
  region: ${AWS_REGION:ap-south-1}
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME:document-service-files}
  dynamodb:
    table-name: ${AWS_DYNAMODB_TABLE_NAME:DocumentMetadata}
  bedrock:
    region: ${AWS_BEDROCK_REGION:us-east-1}
    embedding-model-id: ${AWS_BEDROCK_EMBEDDING_MODEL_ID:amazon.titan-embed-text-v2:0}
    llm-model-id: ${AWS_BEDROCK_LLM_MODEL_ID:amazon.titan-text-lite-v1}

# JWT Configuration - Secret comes from Secrets Manager via ECS
jwt:
  secret: ${JWT_SECRET:change-this-secret-in-production}
  expiration: 86400000  # 24 hours in milliseconds

# CORS Configuration - CloudFront domain will be added dynamically
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

# Logging - Reduced verbosity for production
logging:
  level:
    root: INFO
    com.docmanagement: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

# Actuator endpoints for health checks and monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true


